<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carrito de OmarTech Market con edición de cantidades y resumen de compra.">
  <meta name="theme-color" content="#f6f1e8">
  <title>Carrito | OmarTech Market</title>
  <link rel="icon" type="image/svg+xml" href="../images/store-business-and-finance-svgrepo-com.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body class="page page-cart" data-page="cart" data-root="..">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <header id="site-header" class="site-header"></header>

  <main id="main-content" class="page-main">
    <section class="section">
      <div class="section-frame">
        <div class="page-heading">
          <p class="eyebrow">Gestionar carrito</p>
          <h1 class="page-title">Carrito</h1>
          <p class="page-lead">Revisa tu selección antes de continuar con la compra.</p>
        </div>

        <div class="cart-layout">
          <div class="cart-main">
            <div id="cart-items" class="cart-items"></div>
            <div id="cart-empty" class="empty-state is-hidden">
              <h2>Tu carrito está vacío</h2>
              <p>Agrega productos desde el catálogo para continuar.</p>
              <a class="button button-primary" href="./catalog.html">Ir al catálogo</a>
            </div>
          </div>
          <aside id="cart-summary" class="summary-card"></aside>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="../javascript/app.js"></script>
</body>
</html>
